name: file_format_converter
description: A private, offline-first file converter app. Convert files on-device without uploading anything.
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Local storage
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # File picking & handling
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0
  open_filex: ^4.5.0

  # PDF handling
  pdf: ^3.11.1
  pdfx: ^2.2.0          # PDF rendering to images

  # Image handling
  image: ^4.2.0
  flutter_image_compress: ^2.3.0

  # Permissions

  # UI
  google_fonts: ^6.2.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  share_plus: ^10.0.2

  # Multi-DB failover
  appwrite: ^13.0.0          # Tertiary DB backend
  http: ^1.2.1               # Cloudflare D1 Worker REST calls

  cupertino_icons: ^1.0.8
  archive: ^4.0.9
  crypto: ^3.0.3
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^31.1.19
  google_mlkit_text_recognition: ^0.15.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: 'assets/images/app_icon.png'
  adaptive_icon_background: '#4B6BFB'
  adaptive_icon_foreground: 'assets/images/app_icon.png'
  min_sdk_android: 21
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

dependency_overrides:
  # flutter_web_auth_2 3.x uses deprecated PluginRegistry.Registrar removed
  # in Flutter 3.29. Force 4.x which uses the new FlutterPlugin API.
  flutter_web_auth_2: ^4.0.0
